<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Evolua - Upload</title>
  <script src="js/permissaoUpload.js" defer></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/upload.css" />
  <link rel="stylesheet" href="css/preferencias.css" />
</head>
<body>


  <header class="head">
    <div class="menu">
      <button class="botao-menu" id="botaoMenu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuLateral">
        <img data-icone-menu src="img/menuPreto.png" alt="" />
      </button>
      <img class="logo-evolua" src="img/logoEvolua.png" alt="" />
      <span class="logo-texto" data-nome-empresa>EVOLUA</span>
    </div>

    <div class="resto">
      <div class="sino">
        <img data-icone-notificacao src="img/sinoPreto.png" alt="Notificações" />
      </div>
      
      <div class="pfp">
        <img data-foto-perfil src="img/Captura de tela 2026-08-30 232910.png" alt="Foto de perfil" />
      </div>
    </div>
  </header>

  <div class="fundo-menu" id="fundoMenu" hidden></div>

  <aside class="menu-lateral" id="menuLateral" aria-label="Menu principal" hidden>
    <nav>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./upload.html">Enviar arquivos</a>
      <a href="./configuracao.html">Configurações</a>
      <button id="botaoSair" type="button">Sair</button>
    </nav>
  </aside>

  <main class="conteudo" id="paginaUpload" hidden>
    <section class="area-upload" id="areaEnvioArquivo">
      <div class="icone-upload">↑</div>
      <h3>Envie seus arquivos</h3>
      <p>Arraste seus arquivos para esta área ou clique no botão abaixo.</p>
      <div class="botao-arquivo">Escolher arquivo</div>
      <span class="formatos">XLSX — até 10 MB</span>
    </section>


    <section class="arquivos">
      <h3>Arquivos recentes</h3>
      <div class="arquivo">
        <div class="icone-arquivo">XLS</div>
        <div class="informacoes">
          <strong>turmaMatematica2025.xlsx</strong>
          <span>2.4 MB</span>
        </div>
        <span class="status">Enviado</span>
      </div>

      <div class="arquivo">
        <div class="icone-arquivo">XLS</div>
        <div class="informacoes">
          <strong>turmaPortugues2026.xlsx</strong>
          <span>1.8 MB</span>
        </div>
        <span class="status">Enviado</span>
      </div>
    </section>
  </main>

  <script src="js/preferencias.js"></script>
  <script src="js/menu.js"></script>

</body>
</html>
