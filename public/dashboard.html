<script>
    const ctx = document.getElementById("grafico1").getContext('2d');

    const ctx2 = document.getElementById("grafico3").getContext('2d');

    const myChart = new Chart(ctx, {
        type: 'line', // Options: 'line', 'pie', 'doughnut', 'radar', etc.
        data: {
            labels: ['2022', '2023', '2024', '2025', '2026'], // X-axis labels
            datasets: [{
                label: 'Evolução da evazão',

                backgroundColor: 'rgba(54, 162, 235, 0.5)', // Fill color
                borderColor: 'rgba(54, 162, 235, 1)', // Border color
                borderWidth: 1
            }]
        },
        options: {
            responsive: true, // Scale smoothly with window resizing
            scales: {
                y: {
                    beginAtZero: true // Ensure the Y-axis starts at 0
                }
            }
        }
    });
